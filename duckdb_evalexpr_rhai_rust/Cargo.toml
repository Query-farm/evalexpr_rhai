[package]
name = "duckdb_evalexpr_rhai_rust"
version = "2026.1107.1"
edition = "2021"
# The wasm CI builds use Rust 1.86; this keeps `cargo update` resolving wasm-compatible versions.
rust-version = "1.86"
publish = false

build = "build.rs"

[lib]
name = "duckdb_evalexpr_rhai_rust"
crate-type = ["staticlib"]

[dependencies]
rhai = { version = "1.27.0", features = ["serde"] }
rhai-rand = "0.2.0"
# The `io` feature (file reading / URL fetching) is deliberately left out: scripts must not reach the host.
rhai-sci = { version = "0.4.0", features = ["nalgebra", "rand"], default-features = false }
rhai-url = "0.0.6"

serde_json = "1.0.145"

# Evaluations run on a large separately allocated stack so deeply nested Rhai values cannot
# overflow a DuckDB worker thread's stack (not needed / not available on wasm).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
stacker = "0.1.21"
