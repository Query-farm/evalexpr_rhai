name: Main Extension Distribution Pipeline
on:
  push:
    branches:
    - v1.5
  pull_request: null
  workflow_dispatch: null
  schedule:
  - cron: 0 2 * * *
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{
    github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true
jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5-variegata
      ci_tools_version: v1.5-variegata
      enable_rust: true
      extension_name: evalexpr_rhai
      exclude_archs: windows_amd64_rtools;windows_amd64;windows_amd64_mingw
